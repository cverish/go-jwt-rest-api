services:
  db:
    env_file: ".env"
    image: postgres:14
    container_name: go-jwt-rest-api-db
    restart: always
    ports:
      - "${DB_PORT}:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_volume:/var/lib/postgresql/data

volumes:
  db_volume:
